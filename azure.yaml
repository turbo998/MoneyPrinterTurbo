# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: moneyprinterturbo-azure
infra:
  provider: bicep
  path: infra
  module: main
# azd provisions the private-network foundation and new -env-vnet environment only.
# Incremental provisioning preserves the legacy runtime. Both sidecars/jobs use
# the same immutable image; use the scripted remote-build/runtime/publish flow.
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Validate-Azure.ps1
    interactive: false
